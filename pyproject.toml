[project]
name = "pkgskills"
version = "0.6.3a0"
description = "Ship prompts inside a CLI package and install thin, version-stamped stubs where the harness reads them."
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "typer",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/pkgskills"

[project.scripts]
pkgskills = "pkgskills.cli:pkgskills_app"

# proj-template release stamp, set by proj-init.sh and install-template; inert to consumers.
[tool.proj-template]
version = "0.11.7"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs; a leading "/" anchors each path to the root.
# hatchling always adds pyproject.toml, PKG-INFO, and .gitignore, so keep secrets out of them.
only-include = [
    "/pkgskills",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "hatchling",
    "pre-commit",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov",
    # Same minor as the ruff-pre-commit rev in .pre-commit-config.yaml; bump the two together.
    "ruff>=0.17,<0.18",
]

[tool.ruff]
target-version = "py311"
# ruff formats Python fences in Markdown; keep it off plans and the changelog.
extend-exclude = [".planners/", "CHANGELOG.md"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]
search-path = ["tests/fixtures"]

# tests/ stays type-checked, but unannotated pytest fixture params don't fail implicit-any.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/fixtures"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["pkgskills"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 96
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
